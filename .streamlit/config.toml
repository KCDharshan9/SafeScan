[theme]
base = "light"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 16
baseFontWeight = 400

[theme.light]
primaryColor = "#155eef"
backgroundColor = "#fffcf7"
secondaryBackgroundColor = "#f7f3ed"
textColor = "#172033"
borderColor = "#e9e2d9"
codeBackgroundColor = "#f8f4ee"

[theme.dark]
primaryColor = "#59a9ff"
backgroundColor = "#0a1020"
secondaryBackgroundColor = "#121b2f"
textColor = "#ecf2ff"
borderColor = "#293750"
codeBackgroundColor = "#0d1526"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
